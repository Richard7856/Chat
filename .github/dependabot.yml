version: 2
updates:
  # pnpm monorepo: un único ecosystem "npm" en root cubre todos los workspaces.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Enfoque inicial: solo security updates. Cuando haya más capacidad de
    # review, se puede quitar este filtro para ver minor/patch rutinarios.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - ci
