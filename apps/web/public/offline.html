<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Euromex Chat</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e6ecff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        color: #9aa7c7;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        background: #4f7cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>
        Euromex Chat necesita conexión a internet para enviar o recibir
        mensajes. Reconecta y reintenta.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
