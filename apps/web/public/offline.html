<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Euromex Chat</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0e1a;
        color: #eef2f9;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        text-align: center;
        padding: 2rem;
        border: 1px solid hsl(222 30% 16%);
        border-radius: 14px;
        background: hsl(222 40% 9%);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: hsl(222 85% 60%);
        color: #0a0e1a;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        font-weight: 700;
        font-size: 1.25rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; letter-spacing: -0.01em; }
      p { color: hsl(217 18% 62%); line-height: 1.55; margin: 0.5rem 0 0; }
      button {
        margin-top: 1.75rem;
        padding: 0.625rem 1.25rem;
        background: hsl(222 85% 60%);
        color: #0a0e1a;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }
      button:hover { background: hsl(222 85% 55%); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">E</div>
      <h1>Sin conexión</h1>
      <p>
        Euromex Chat necesita internet para enviar o recibir mensajes.
        Reconecta y reintenta.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
