services:
  postgres:
    image: postgres:16-alpine
    container_name: euromex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-euromex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-euromex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-euromex_chat}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ../apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-euromex} -d ${POSTGRES_DB:-euromex_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: euromex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-euromex_dev_only}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-euromex_dev_only}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
