apply plugin: 'com.android.application'

// ============================================================================
// Signing config para release builds (Play Store).
//
// Lee credenciales desde variables de entorno para nunca commitear el keystore
// ni los passwords al repo. Si las env vars no están set, fallbackea al
// debug keystore (útil cuando alguien builda local sin querer firmar).
//
//   EUROMEX_KEYSTORE_PATH       — ruta absoluta al .keystore (default: app/euromex-release.keystore)
//   EUROMEX_KEYSTORE_PASSWORD   — password del keystore
//   EUROMEX_KEY_ALIAS           — alias de la key (default: euromex)
//   EUROMEX_KEY_PASSWORD        — password del alias
//
// Generar el keystore una sola vez con:
//   apps/mobile/scripts/generate-keystore.sh
//
// Buildear AAB de release:
//   apps/mobile/scripts/build-aab.sh
// ============================================================================
def releaseKeystorePath = System.getenv('EUROMEX_KEYSTORE_PATH')
    ?: "${rootDir}/app/euromex-release.keystore"
def releaseKeystorePassword = System.getenv('EUROMEX_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('EUROMEX_KEY_ALIAS') ?: 'euromex'
def releaseKeyPassword = System.getenv('EUROMEX_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePassword != null &&
                        releaseKeyPassword != null &&
                        file(releaseKeystorePath).exists()

android {
    namespace "com.grupoeuromex.chat"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.grupoeuromex.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("⚠ Release build sin signing config — usando debug keystore. " +
                            "NO subir a Play Store. Ver apps/mobile/PUBLISHING.md.")
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
